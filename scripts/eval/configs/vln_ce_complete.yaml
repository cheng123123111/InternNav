# @package _global_
# Complete VLN-CE config with all measurements

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/actions:
    - look_up
    - look_down
  - _self_

habitat:
  environment:
    max_episode_steps: 1000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False

  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0

  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError

  dataset:
    split: val_unseen
    scenes_dir: /mnt/data/VL-LN-Bench/scene_datasets/
    # Use filtered dataset with 102 medium-difficulty episodes from all 11 scenes
    data_path: /mnt/data/0923_Interndata/vln_ce/raw_data/r2r/val_unseen/val_unseen_medium100.json.gz
    # content_scenes: removed to load all 11 scenes
