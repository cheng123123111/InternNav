# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/objectnav: hm3d
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/actions:
    - look_up
    - look_down
  - _self_

habitat:
  environment:
    max_episode_steps: 2000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0, 1.25, 0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
            position: [0, 1.25, 0]
        height: 1.25
        radius: 0.18
    forward_step_size: 0.25
    turn_angle: 30
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: True
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: VIEW_POINTS
      success:
        type: Success
        success_distance: 0.25
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
  dataset:
    type: ObjectNav-v1
    split: val
    scenes_dir: /mnt/data/0923_Interndata/VL-LN-Bench/scene_datasets/
    data_path: /mnt/data/0923_Interndata/InternNav/data/datasets/objectnav_hm3d_v2/{split}/{split}.json.gz
